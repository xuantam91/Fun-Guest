<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c0fc"/>
      <stop offset="40%" stop-color="#339af0"/>
      <stop offset="100%" stop-color="#1c7ed6"/>
    </linearGradient>
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ce99a"/>
      <stop offset="100%" stop-color="#40c057"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#f59f00"/>
    </linearGradient>
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8787" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff8787" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded card for favicon crispness -->
  <rect width="512" height="512" rx="128" fill="#eaf9e7"/>

  <!-- Magic Sparkles -->
  <path d="M90 90 Q90 115 65 115 Q90 115 90 140 Q90 115 115 115 Q90 115 90 90 Z" fill="#ffd43b"/>
  <path d="M430 110 Q430 130 410 130 Q430 130 430 150 Q430 130 450 130 Q430 130 430 110 Z" fill="#ff922b"/>

  <!-- Main Globe Body -->
  <g>
    <circle cx="256" cy="285" r="165" fill="url(#globeGrad)" stroke="#ffffff" stroke-width="10"/>
    
    <!-- Continents -->
    <path d="M140 220 Q180 190 220 210 Q240 240 200 270 Q160 280 130 250 Z" fill="url(#landGrad)"/>
    <path d="M280 330 Q330 310 370 340 Q390 390 340 415 Q290 420 270 370 Z" fill="url(#landGrad)"/>
    <ellipse cx="340" cy="220" rx="35" ry="25" fill="url(#landGrad)"/>

    <!-- Light Reflection -->
    <path d="M150 185 A130 130 0 0 1 290 155" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.65"/>

    <!-- Cute Cheeks -->
    <circle cx="185" cy="305" r="24" fill="url(#blushGrad)"/>
    <circle cx="327" cy="305" r="24" fill="url(#blushGrad)"/>

    <!-- Eyes -->
    <ellipse cx="205" cy="275" rx="20" ry="26" fill="#212529"/>
    <circle cx="198" cy="264" r="9" fill="#ffffff"/>
    <circle cx="212" cy="285" r="4" fill="#ffffff"/>

    <ellipse cx="307" cy="275" rx="20" ry="26" fill="#212529"/>
    <circle cx="300" cy="264" r="9" fill="#ffffff"/>
    <circle cx="314" cy="285" r="4" fill="#ffffff"/>

    <!-- Smile -->
    <path d="M226 300 Q256 340 286 300" fill="#c92a2a" stroke="#212529" stroke-width="5" stroke-linecap="round"/>
    <path d="M242 316 Q256 336 270 316 Z" fill="#ff8787"/>
  </g>

  <!-- Explorer Cap -->
  <g transform="translate(256, 120)">
    <ellipse cx="0" cy="18" rx="90" ry="18" fill="url(#capGrad)" stroke="#ffffff" stroke-width="6"/>
    <path d="M-64 14 C-64 -35 64 -35 64 14 Z" fill="url(#capGrad)" stroke="#ffffff" stroke-width="6"/>
    <path d="M0 -6 L4 4 L14 4 L6 11 L9 20 L0 14 L-9 20 L-6 11 L-14 4 L-4 4 Z" fill="#ffffff"/>
    <!-- Propeller Sprout -->
    <path d="M0 -34 Q-16 -56 0 -68 Q16 -56 0 -34 Z" fill="#51cf66"/>
    <circle cx="0" cy="-34" r="7" fill="#f59f00"/>
  </g>
</svg>
